<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
  body {
    margin: 0;
    padding: 40px;
    background: transparent;
    display: flex;
    flex-direction: column;
    gap: 40px;
    align-items: center;
  }
  .mark-box {
    width: 240px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .lockup-box {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 72px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #f4f2ee;
  }
  .wordmark span {
    color: #e92a42;
  }
</style>
</head>
<body>
  <div class="mark-box" id="mark">
    <svg viewBox="230 260 620 520" width="220" height="184" fill="none">
      <path d="M540 515 L540 768" stroke="#f4f2ee" stroke-width="24" stroke-linecap="round"/>

      <path d="M540 515 C548 450 610 375 833 315" stroke="#f4f2ee" stroke-width="24" stroke-linecap="round"/>

      <path d="M610 386 Q640 332 680 295" stroke="#f4f2ee" stroke-width="24" stroke-linecap="round"/>
      <path d="M362 352 Q338 312 312 273" stroke="#f4f2ee" stroke-width="24" stroke-linecap="round"/>
      <path d="M718 352 Q742 312 768 273" stroke="#f4f2ee" stroke-width="24" stroke-linecap="round"/>
      <polygon points="540,286 530,322 550,322" fill="#e92a42"/>
    </svg>
  </div>

  <div class="lockup-box" id="lockup">
    <svg viewBox="230 260 620 520" width="110" height="92" fill="none">
      <path d="M540 515 L540 768" stroke="#f4f2ee" stroke-width="28" stroke-linecap="round"/>
      <path d="M540 515 C532 450 470 375 247 315" stroke="#f4f2ee" stroke-width="28" stroke-linecap="round"/>
      <path d="M540 515 C548 450 610 375 833 315" stroke="#f4f2ee" stroke-width="28" stroke-linecap="round"/>
      <path d="M470 386 Q440 332 400 295" stroke="#f4f2ee" stroke-width="28" stroke-linecap="round"/>
      <path d="M610 386 Q640 332 680 295" stroke="#f4f2ee" stroke-width="28" stroke-linecap="round"/>
      <path d="M362 352 Q338 312 312 273" stroke="#f4f2ee" stroke-width="28" stroke-linecap="round"/>
      <path d="M718 352 Q742 312 768 273" stroke="#f4f2ee" stroke-width="28" stroke-linecap="round"/>
      <polygon points="540,286 530,322 550,322" fill="#e92a42"/>
    </svg>
    <div class="wordmark">l<span>o</span>ckin</div>
  </div>

</html>
